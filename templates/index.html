<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>云栖茶事 · 在线点单</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar"><a class="brand" href="/"><span>YQ</span><b>云栖茶事</b></a><div class="topbar-copy">现点现做 · 到店自取</div><a class="admin-link" href="/admin/">管理后台</a></header>
  <main class="page-shell">
    <section class="welcome"><div><p class="eyebrow">YUNQI TEA HOUSE</p><h1>喝一杯，<em>松弛一下。</em></h1><p>精选原叶茶与真鲜乳，认真做好每一杯。</p></div><img src="{{ url_for('static', filename='images/hero-milk-tea.png') }}" alt="云栖茶事奶茶"></section>
    <section class="order-page"><div class="heading"><div><p class="eyebrow">MENU</p><h2>今天想喝什么？</h2></div><button class="history-button" id="show-lookup">查询订单</button></div><div class="category-strip" id="categories" aria-label="饮品分类"></div><div class="product-grid" id="products" aria-live="polite"></div></section>
  </main>
  <section class="bag-bar" id="bag-bar"><div class="bag-summary"><span class="bag-icon">🛍</span><div><b id="bag-count">还没选饮品</b><small id="bag-total">点一杯试试吧</small></div></div><button id="open-bag" class="checkout-button" disabled>去结算 <span>→</span></button></section>
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="bottom-sheet" id="bag-sheet" aria-label="购物袋" hidden><div class="sheet-handle"></div><div class="sheet-title"><div><p class="eyebrow">YOUR BAG</p><h2>已选饮品</h2></div><button class="plain-close" data-close-sheet aria-label="关闭">×</button></div><div class="bag-items" id="bag-items"></div><div class="sheet-total"><span>合计</span><strong id="sheet-total">¥0</strong></div><button class="pay-button" id="open-checkout">确认订单 <span id="checkout-total">¥0</span></button></section>
  <section class="bottom-sheet compact-sheet" id="checkout-sheet" aria-label="确认订单" hidden><div class="sheet-handle"></div><div class="sheet-title"><div><p class="eyebrow">CHECKOUT</p><h2>确认取餐信息</h2></div><button class="plain-close" data-close-sheet aria-label="关闭">×</button></div><p class="sheet-note">支付后会生成取餐号，请凭取餐号到店取饮品。</p><form id="order-form"><label>取餐称呼<input name="customer_name" placeholder="例如：小林" maxlength="20" required></label><label>手机尾号四位<input name="phone_last4" inputmode="numeric" pattern="\d{4}" maxlength="4" placeholder="例如：1234" required></label><button class="pay-button">模拟支付并下单 <span id="pay-total">¥0</span></button></form></section>
  <section class="bottom-sheet compact-sheet" id="lookup-sheet" aria-label="查询订单" hidden><div class="sheet-handle"></div><div class="sheet-title"><div><p class="eyebrow">ORDER LOOKUP</p><h2>查询订单</h2></div><button class="plain-close" data-close-sheet aria-label="关闭">×</button></div><form id="lookup-form" class="lookup-form"><input id="order-no" placeholder="输入完整订单号" required><button class="pay-button">查询</button></form><div id="lookup-result" class="lookup-result"></div></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body></html>
